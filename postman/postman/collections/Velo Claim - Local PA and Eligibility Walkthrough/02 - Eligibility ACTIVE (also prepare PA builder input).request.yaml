auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.collectionVariables.set('case_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) throw new Error(pm.response.text());
      pm.test("Local eligibility is Active", () => pm.expect(pm.response.json().claim.eligibility.status).to.eql('Active'));
      const data = pm.response.json(); const c = data.claim;
      pm.collectionVariables.set('claim_id',data.claim_id);
      const state = {claim:{claim_id:data.claim_id}, canonical_claim:c.canonical_claim,
       source_context:c.source_context, route:c.route, payload_version:c.claim_payload_row.version,
       routing_context:{payer_id:c.canonical_claim.payer.id, plan_id:c.canonical_claim.payer.plan_id}};
      pm.collectionVariables.set('pa_build_body',JSON.stringify({state,required_codes:['99213']}));
    language: text/javascript
order: 2000
