$kind: http-request
url: "{{base_url}}/claims/{{claim_id}}"
method: GET
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) throw new Error(pm.response.text());
      pm.test("Stored eligibility is Active", () => pm.expect(pm.response.json().eligibility.status).to.eql('Active'));
    language: text/javascript
order: 3000
