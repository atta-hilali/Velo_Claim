scripts:
  - type: beforeRequest
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.collectionVariables.set('case_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) throw new Error(pm.response.text());
      const c=pm.response.json().claim;
      const issue=c.validation_report.issues.find(i => i.code === 'PA_REQUIRED_MISSING');
      pm.test('Mock payer rule requires PA', () => pm.expect(issue).to.be.an('object'));
      pm.collectionVariables.set('auto_pa_request_id',issue.evidence.request_id);
      pm.test('Claim cannot be submitted yet', () => pm.expect(c.status).not.to.eql('ready'));
    language: text/javascript
order: 14000
