$kind: http-request
url: "{{base_url}}/claims/{{claim_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "review",
      "reason": "Postman lifecycle test",
      "metadata": {"test_run": true}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status update returns HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Status update reports success', () => pm.expect(pm.response.json().ok).to.eql(true));
    language: text/javascript
order: 6000
