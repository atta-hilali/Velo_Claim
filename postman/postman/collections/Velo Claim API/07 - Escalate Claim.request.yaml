$kind: http-request
url: "{{base_url}}/claims/{{claim_id}}/actions/escalate"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Postman escalation test",
      "metadata": {"test_run": true}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Escalation returns HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Escalation reports success', () => pm.expect(pm.response.json().ok).to.eql(true));
    language: text/javascript
order: 7000
